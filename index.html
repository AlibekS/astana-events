<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Афиша Астаны</title>
  <meta name="description" content="Концерты, театр, балет, выставки и стендап в Астане на ближайшие две недели. Без рекламы и шума.">
  <meta name="theme-color" content="#F2F5FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090D16" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="Афиша Астаны">
  <meta property="og:description" content="Что происходит в Астане в ближайшие 15 дней — в одном календаре.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script>
    // Тема до первой отрисовки — без «вспышки».
    (function () {
      var t = null;
      try { t = localStorage.getItem('afisha-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="preconnect" href="https://sxodim.com">
  <link rel="preload" as="fetch" href="data/events.json" crossorigin>
  <link rel="modulepreload" href="assets/js/app.js">
  <link rel="modulepreload" href="assets/js/calendar.js">
  <link rel="modulepreload" href="assets/js/filters.js">
  <link rel="stylesheet" href="assets/css/themes.css">
  <link rel="stylesheet" href="assets/css/glass.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.7 4.7l1.6 1.6M17.7 17.7l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.7 19.3l1.6-1.6M17.7 6.3l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 1 1 13 0c0 5.4-6.5 11-6.5 11Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13.5M13 6.5 18.5 12 13 17.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8.5" cy="14" r="1.1" fill="currentColor"/><circle cx="12" cy="14" r="1.1" fill="currentColor"/><circle cx="15.5" cy="14" r="1.1" fill="currentColor"/></symbol>
      <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3.5 8.5V6.8c0-.7.6-1.3 1.3-1.3h14.4c.7 0 1.3.6 1.3 1.3v1.7a2.5 2.5 0 0 0 0 5v1.7c0 .7-.6 1.3-1.3 1.3H4.8c-.7 0-1.3-.6-1.3-1.3v-1.7a2.5 2.5 0 0 0 0-5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 6v12" stroke="currentColor" stroke-width="1.6" stroke-dasharray="1.6 2.2"/></symbol>
      <symbol id="i-all" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-concerts" viewBox="0 0 24 24"><path d="M9 17.5V5.5l10-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="15.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-theater" viewBox="0 0 24 24"><path d="M4 4.5h10v6.5a5 5 0 0 1-10 0V4.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 9h6v5.5a5 5 0 0 1-8.3 3.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M6.8 8.3h.01M11.2 8.3h.01M7 12.3c1.1.9 2.9.9 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-exhibitions" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m6.5 16 4-4.5 3 3 2-2 2.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor"/></symbol>
      <symbol id="i-events" viewBox="0 0 24 24"><path d="M12 3.5 13.9 9l5.6.2-4.4 3.5 1.6 5.4L12 15l-4.7 3.1 1.6-5.4L4.5 9.2l5.6-.2L12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <div class="ambient" aria-hidden="true">
    <span class="blob blob--a"></span>
    <span class="blob blob--b"></span>
    <span class="blob blob--c"></span>
  </div>

  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="./">
        <span class="brand__mark" aria-hidden="true">А</span>
        <span class="brand__text">Афиша <b>Астаны</b></span>
      </a>
      <div class="topbar__actions">
        <span class="updated" id="updated" hidden></span>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Переключить тему">
          <svg class="i i--sun"><use href="#i-sun"/></svg>
          <svg class="i i--moon"><use href="#i-moon"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="container intro">
      <p class="intro__eyebrow" id="eyebrow">Ближайшие 15 дней</p>
      <h1 class="intro__title" id="dayTitle">Что происходит в&nbsp;Астане</h1>
    </section>

    <section class="calbar" id="calbar" aria-label="Календарь">
      <div class="container calbar__inner">
        <div class="calbar__head">
          <button class="view-toggle" id="viewToggle" type="button" aria-pressed="false">
            <svg class="i"><use href="#i-grid"/></svg><span id="viewToggleLabel">Календарь</span>
          </button>
        </div>
        <div class="days" id="days" role="listbox" aria-label="Выбор даты"></div>
      </div>
    </section>

    <section class="container toolbar" aria-label="Фильтры">
      <div class="chips" id="chips" role="group" aria-label="Категории"></div>
      <div class="toolbar__right">
        <label class="search">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Артист, спектакль, площадка" autocomplete="off" aria-label="Поиск по событиям">
        </label>
        <button class="toggle" id="freeToggle" type="button" role="switch" aria-checked="false">
          <span class="toggle__track"><span class="toggle__thumb"></span></span>
          <span>Бесплатно</span>
        </button>
      </div>
    </section>

    <section class="container results" id="results" aria-live="polite">
      <div class="skeleton-grid" aria-hidden="true">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </section>
  </main>

  <footer class="container footer">
    <p>Данные собираются автоматически из открытых афиш <span id="sources">Sxodim, Ticketon</span>. Цены и наличие билетов уточняйте на сайте продавца.</p>
    <p class="footer__meta" id="footMeta"></p>
  </footer>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet__panel" id="sheetBody"></div>
  </dialog>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
